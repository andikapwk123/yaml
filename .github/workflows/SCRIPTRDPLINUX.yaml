name: VPS-DIKA-FINAL-Sakti-GDrive

on:
  workflow_dispatch:
    inputs:
      os_choice:
        type: choice
        description: 'Pilih OS Gantengku:'
        options:
          - windows-latest
          - ubuntu-22.04
        default: 'ubuntu-22.04'
      user_name:
        description: 'Username SSH/RDP'
        required: true
        default: 'DikaOwner'
      user_password:
        description: 'Password (Minimal 8 karakter, ada Simbol & Angka: Dika@123!)'
        required: true
        default: 'DikaGanteng@123!'

jobs:
  run-vps:
    runs-on: ${{ github.event.inputs.os_choice }}
    timeout-minutes: 360

    steps:
      # --- 1. SETUP OS & USER (SEMUA OS) ---
      - name: 1. Setup OS & User
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0; Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0; Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'; \$pass = ConvertTo-SecureString '${{ github.event.inputs.user_password }}' -AsPlainText -Force; New-LocalUser -Name '${{ github.event.inputs.user_name }}' -Password \$pass -FullName '${{ github.event.inputs.user_name }} Boss'; Add-LocalGroupMember -Group 'Administrators' -Member '${{ github.event.inputs.user_name }}'; Add-LocalGroupMember -Group 'Remote Desktop Users' -Member '${{ github.event.inputs.user_name }}'"
          else
            sudo apt-get update && sudo apt-get install -y openssh-server curl rclone
            sudo useradd -m -s /bin/bash ${{ github.event.inputs.user_name }} || true
            echo "${{ github.event.inputs.user_name }}:${{ github.event.inputs.user_password }}" | sudo chpasswd
            sudo usermod -aG sudo ${{ github.event.inputs.user_name }}
            sudo service ssh start
          fi

      # --- 2. CONFIG GDRIVE & RESTORE DATA (HANYA UNTUK UBUNTU) ---
      - name: 2. Configure GDrive & Restore (Ubuntu Only)
        if: github.event.inputs.os_choice == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p ~/.config/rclone
          echo '[gdrive]' > ~/.config/rclone/rclone.conf
          echo 'type = drive' >> ~/.config/rclone/rclone.conf
          echo 'scope = drive' >> ~/.config/rclone/rclone.conf
          echo 'token = ${{ secrets.RCLONE_CONFIG_TOKEN }}' >> ~/.config/rclone/rclone.conf
          
          # Buat folder kerja dengan izin penuh
          sudo mkdir -p /home/${{ github.event.inputs.user_name }}/work_folder
          sudo rclone copy gdrive:Backup_VPS_Dika /home/${{ github.event.inputs.user_name }}/work_folder || true
          sudo chown -R ${{ github.event.inputs.user_name }}:${{ github.event.inputs.user_name }} /home/${{ github.event.inputs.user_name }}/work_folder
          echo "RESTORE DATA UBUNTU BERHASIL, GANTENGKU!"

      # --- 3. INSTALL TAILSCALE (SEMUA OS) ---
      - name: 3. Install & Connect Tailscale
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Import-Module BitsTransfer; Start-BitsTransfer -Source 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -Destination 'tailscale.msi'; Start-Process msiexec.exe -ArgumentList '/i', 'tailscale.msi', '/quiet', '/norestart' -Wait"
            sleep 15
            "/c/Program Files/Tailscale/tailscale.exe" up --hostname=vps-windows-dika || true
          else
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo timeout 5m tailscale up --hostname=vps-ubuntu-dika --accept-routes || true
          fi

      # --- 4. AUTO-SYNC TO GDRIVE (HANYA UNTUK UBUNTU) ---
      - name: 4. Auto-Sync to GDrive (Ubuntu Only)
        if: github.event.inputs.os_choice == 'ubuntu-22.04'
        shell: bash
        run: |
          cat <<EOF > sync.sh
          #!/bin/bash
          while true; do
            sudo rclone sync /home/${{ github.event.inputs.user_name }}/work_folder gdrive:Backup_VPS_Dika
            sleep 300
          done
          EOF
          chmod +x sync.sh
          nohup ./sync.sh > /dev/null 2>&1 &
          echo "AUTO-SAVE UBUNTU AKTIF TIAP 5 MENIT, CAYANG!"

      # --- 5. FINAL INFO & KEEP ALIVE (SEMUA OS) ---
      - name: 5. Info & Keep Alive
        shell: bash
        run: |
          echo "===================================================="
          echo " 🔥 VPS ${{ github.event.inputs.os_choice }} SUDAH AKTIF! 🔥 "
          echo "===================================================="
          echo " USERNAME   : ${{ github.event.inputs.user_name }}"
          echo " PASSWORD   : ${{ github.event.inputs.user_password }}"
          if [ "${{ github.event.inputs.os_choice }}" == "ubuntu-22.04" ]; then
            echo " FOLDER DATA: /home/${{ github.event.inputs.user_name }}/work_folder"
            echo " STATUS     : Ubuntu Mode (Auto-Backup Aktif!)"
          else
            echo " STATUS     : Windows Mode (Polos / No Backup)"
          fi
          echo "===================================================="
          echo "IP VPS: $([ "${{ runner.os }}" = "Windows" ] && echo "Cek di App Tailscale" || tailscale ip -4)"
          [ "${{ runner.os }}" = "Windows" ] && while true; do sleep 300; done || sleep 21600
