name: SSH VPS via Tailscale

on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi (jam)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
      package:
        description: 'Paket tools'
        required: true
        default: 'basic'
        type: choice
        options:
          - 'basic'      # Tools dasar
          - 'dev'        # Dev tools
          - 'hacking'    # Pentesting tools

jobs:
  ssh-vps:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(github.event.inputs.duration) * 60 }}
    
    steps:
    - name: Setup SSH Server
      run: |
        echo "🔄 Setup SSH..."
        
        # Install SSH
        sudo apt update
        sudo apt install -y openssh-server
        
        # Konfigurasi SSH
        sudo sed -i 's/#Port 22/Port 22/' /etc/ssh/sshd_config
        sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo sed -i 's/#PermitRootLogin no/PermitRootLogin no/' /etc/ssh/sshd_config
        
        # Restart SSH
        sudo systemctl restart ssh
        
        echo "✅ SSH ready on port 22"
    
    - name: Generate SSH Credentials
      run: |
        # Generate random password
        PASSWORD=$(openssl rand -base64 12 | tr -d '/+=' | cut -c1-12)
        USERNAME="vpsuser"
        
        # Buat user baru atau pakai runner
        if id "$USERNAME" &>/dev/null; then
          sudo userdel -r "$USERNAME"
        fi
        
        sudo useradd -m -s /bin/bash "$USERNAME"
        echo "$USERNAME:$PASSWORD" | sudo chpasswd
        
        # Tambah ke sudoers
        echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$USERNAME
        
        echo "USERNAME=$USERNAME" >> $GITHUB_ENV
        echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
        echo "SSH_PASSWORD=$PASSWORD" >> $GITHUB_ENV
        
        echo "👤 User: $USERNAME"
        echo "🔐 Pass: $PASSWORD"
    
    - name: Install Selected Tools
      run: |
        echo "📦 Installing ${{ github.event.inputs.package }} package..."
        
        # Common tools untuk semua package
        sudo apt install -y \
          curl wget git nano vim htop \
          neofetch tmux screen net-tools
        
        if [ "${{ github.event.inputs.package }}" = "dev" ]; then
          echo "➕ Installing dev tools..."
          sudo apt install -y \
            python3 python3-pip nodejs npm \
            build-essential gcc g++ make \
            docker.io docker-compose \
            jq yarn
          
        elif [ "${{ github.event.inputs.package }}" = "hacking" ]; then
          echo "➕ Installing pentest tools..."
          sudo apt install -y \
            nmap netcat-traditional socat \
            dnsutils whois traceroute \
            python3-venv python3-dev
            
          # Install tools via pip
          pip3 install --upgrade pip
          pip3 install requests beautifulsoup4 scapy
        fi
        
        echo "✅ Tools installed"
    
    - name: Install Tailscale
      run: |
        echo "🔗 Installing Tailscale..."
        
        # Install Tailscale
        curl -fsSL https://tailscale.com/install.sh | sh
        
        # Start Tailscale
        sudo tailscale up \
          --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
          --hostname=github-vps-${{ github.run_id }} \
          --advertise-exit-node \
          --accept-dns=false
        
        # Tunggu IP
        echo "⏳ Waiting for Tailscale IP..."
        sleep 10
        
        TS_IP=$(tailscale ip -4)
        if [ -z "$TS_IP" ]; then
          TS_IP=$(tailscale ip -6)
        fi
        
        if [ -z "$TS_IP" ]; then
          echo "⚠ Tailscale IP not found, retrying..."
          sleep 10
          TS_IP=$(tailscale ip -4 || tailscale ip -6)
        fi
        
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
        echo "✅ Tailscale IP: $TS_IP"
    
    - name: Setup SSH Key (Optional)
      run: |
        # Generate SSH key pair untuk user
        sudo -u $USERNAME bash -c "
          mkdir -p /home/$USERNAME/.ssh
          ssh-keygen -t ed25519 -f /home/$USERNAME/.ssh/id_ed25519 -N '' -q
          cat /home/$USERNAME/.ssh/id_ed25519.pub > /home/$USERNAME/.ssh/authorized_keys
          chmod 700 /home/$USERNAME/.ssh
          chmod 600 /home/$USERNAME/.ssh/*
        "
        
        # Copy private key untuk ditampilkan (HATI-HATI!)
        PRIV_KEY=$(sudo cat /home/$USERNAME/.ssh/id_ed25519)
        echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
        echo "$PRIV_KEY" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        echo "🔑 SSH Key generated"
    
    - name: Display Connection Info
      run: |
        echo ""
        echo "=================================================="
        echo "           🚀 VPS SSH READY FOR TERMUX           "
        echo "=================================================="
        echo ""
        echo "📱 **DI TERMUX ANDROID:**"
        echo ""
        echo "1️⃣ **Install dulu di Termux:**"
        echo "   pkg update && pkg upgrade"
        echo "   pkg install openssh"
        echo ""
        echo "2️⃣ **Cara konek SSH:**"
        echo "   ssh $USERNAME@$TAILSCALE_IP"
        echo ""
        echo "3️⃣ **Atau pakai password:**"
        echo "   sshpass -p '$PASSWORD' ssh $USERNAME@$TAILSCALE_IP"
        echo ""
        echo "4️⃣ **Copy-paste command langsung:**"
        echo "   ssh $USERNAME@$TAILSCALE_IP"
        echo "   Password: $PASSWORD"
        echo ""
        echo "--------------------------------------------------"
        echo "🔧 **CONNECTION DETAILS:**"
        echo "IP: $TAILSCALE_IP"
        echo "User: $USERNAME"
        echo "Password: $PASSWORD"
        echo "Port: 22"
        echo "Duration: ${{ github.event.inputs.duration }} hours"
        echo "Package: ${{ github.event.inputs.package }}"
        echo ""
        echo "🔑 **SSH Private Key (jika mau):**"
        echo "$PRIVATE_KEY"
        echo ""
        echo "💡 **Tips:**"
        echo "- Install 'Termux:Styling' untuk tema keren"
        echo "- Install 'Termux:API' untuk akses fitur Android"
        echo "- Install 'tmux' untuk multiple sessions"
        echo "=================================================="
        echo ""
        
        # QR Code untuk IP (optional)
        sudo apt install -y qrencode
        echo "📲 Scan QR untuk copy IP:"
        qrencode -t ANSI "$TAILSCALE_IP"
    
    - name: Keep VPS Alive
      run: |
        echo "🔄 VPS aktif selama ${{ github.event.inputs.duration }} jam..."
        echo "Tekan 'Cancel' di GitHub untuk stop"
        echo ""
        
        MINUTES=$(( ${{ fromJson(github.event.inputs.duration) }} * 60 ))
        for i in $(seq 1 $MINUTES); do
          REMAIN=$((MINUTES - i))
          echo "[$(date '+%H:%M:%S')] VPS aktif - $REMAIN menit tersisa"
          echo "IP: $TAILSCALE_IP"
          echo "User: $USERNAME"
          echo "Pass: $PASSWORD"
          echo "Connected users:"
          who | grep -v "\\[github\\]" || echo "No active connections"
          echo "---"
          sleep 60
        done
        
        echo "⏰ Time's up! VPS shutting down..."
