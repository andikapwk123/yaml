name: UBUNTU-SSH-MANUAL-LINK

on:
  workflow_dispatch: # Jalankan manual dari tab Actions, Ganteng!

jobs:
  vps-run:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Update & Setup SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server curl
          # Set password user 'dikacyber' jadi andikapwk
          echo "dikacyber:andikapwk" | sudo chpasswd
          sudo service ssh start
          echo "SSH Server Ready, Sayangku!"

      - name: 2. Connect Tailscale & Munculin Link
        run: |
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          echo "------------------------------------------------------------"
          echo "⚠️  GANTENGKU, KLIK LINK DI BAWAH INI BUAT LOGIN: ⚠️"
          echo "------------------------------------------------------------"
          
          # Perintah ini bakal ngasih link login di log GitHub
          # Kita kasih timeout 5 menit biar gak nunggu selamanya kalo bos lupa
          sudo timeout 5m tailscale up --hostname=vps-manual-dika --accept-routes || true
          
          echo "------------------------------------------------------------"
          # Cek apakah login sukses dan ambil IP-nya
          TS_IP=$(tailscale ip -4)
          echo "ALAMAT IP VPS KAMU SEKARANG: $TS_IP"
          echo "------------------------------------------------------------"

      - name: 3.Lagi Upgrade Dulu Biar Langsung Pake
        run: |
          # UPGRADING
           echo "------------------------------------------------------------"
           
           sudo apt update
           sudo apt upgrade
           
           echo "UDAH YA ABANG DIKA"
           
           echo "------------------------------------------------------------"

      - name: 4. Jaga Server Tetap Nyala (6 Jam)
        run: |
          TS_IP=$(tailscale ip -4)
          echo "===================================================="
          echo "   🔥 VPS UBUNTU AKTIF - MODE MANUAL 🔥   "
          echo "===================================================="
          echo " IP ADDRESS : $TS_IP"
          echo " USERNAME   : dikacyber"
          echo " PASSWORD   : andikapwk"
          echo " CARA LOGIN : ssh dikacyber@$TS_IP"
          echo "===================================================="
          
          # Biarkan server tetap hidup sampai batas maksimal GitHub
          sleep 21600
