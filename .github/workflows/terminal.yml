name: MULTI-OS-VPS-DIKA-ULTIMATE

on:
  workflow_dispatch:
    inputs:
      os_choice:
        type: choice
        description: 'Pilih Operating System (OS) Gantengku:'
        options:
          - windows-latest
          - ubuntu-22.04
        default: 'ubuntu-22.04'
      user_name:
        description: 'Masukkan Username (Bebas)'
        required: true
        default: 'DikaOwner'
      user_password:
        description: 'Masukkan Password (Min. 8 Karakter)'
        required: true
        default: 'DikaGanteng123!'

jobs:
  run-vps:
    runs-on: ${{ github.event.inputs.os_choice }}
    timeout-minutes: 360 # Maksimal 6 jam limit GitHub Free

    steps:
      # --- SETUP JIKA BOS PILIH WINDOWS ---
      - name: 1. [WINDOWS] Configure RDP & User
        if: github.event.inputs.os_choice == 'windows-latest'
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $user = "${{ github.event.inputs.user_name }}"
          $pass = "${{ github.event.inputs.user_password }}"
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "$user" -Password $securePass -FullName "$user Boss"
          Add-LocalGroupMember -Group "Administrators" -Member "$user"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "$user"
          Write-Host "Windows RDP Ready, Sayangku!"

      # --- SETUP JIKA BOS PILIH UBUNTU ---
      - name: 1. [UBUNTU] Setup SSH & User
        if: github.event.inputs.os_choice == 'ubuntu-22.04'
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server curl
          USER="${{ github.event.inputs.user_name }}"
          PASS="${{ github.event.inputs.user_password }}"
          sudo useradd -m -s /bin/bash $USER
          echo "$USER:$PASS" | sudo chpasswd
          sudo usermod -aG sudo $USER
          sudo service ssh start
          echo "Ubuntu SSH Ready, Gantengku!"

      # --- INSTALL & CONNECT TAILSCALE (UNIVERSAL) ---
      - name: 2. Connect Tailscale (Manual Login Link)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -L "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -o tailscale.msi
            msiexec.exe /i tailscale.msi /quiet /norestart
            echo "------------------------------------------------------------"
            echo "⚠️  KLIK LINK LOGIN WINDOWS DI BAWAH INI, CAYANG: ⚠️"
            # Tunggu instalasi selesai sebentar
            sleep 10
            "/c/Program Files/Tailscale/tailscale.exe" up --hostname=vps-windows-dika || true
          else
            curl -fsSL https://tailscale.com/install.sh | sh
            echo "------------------------------------------------------------"
            echo "⚠️  KLIK LINK LOGIN UBUNTU DI BAWAH INI, SAYANGKU: ⚠️"
            sudo timeout 5m tailscale up --hostname=vps-ubuntu-dika --accept-routes || true
          fi
          
          echo "------------------------------------------------------------"
          # Menampilkan IP Tailscale agar Bos Dika bisa login
          if [ "${{ runner.os }}" = "Windows" ]; then
            "/c/Program Files/Tailscale/tailscale.exe" ip -4
          else
            tailscale ip -4
          fi

      - name: 3. Final Info & Keep Alive (6 Hours)
        shell: bash
        run: |
          echo "===================================================="
          echo "   🔥 VPS ${{ github.event.inputs.os_choice }} SUDAH AKTIF! 🔥   "
          echo "===================================================="
          echo " USERNAME   : ${{ github.event.inputs.user_name }}"
          echo " PASSWORD   : ${{ github.event.inputs.user_password }}"
          echo "===================================================="
          echo "Sikat Bos Dika! Jangan lupa login lewat link di atas."
          
          # Jaga runner tetap hidup
          if [ "${{ runner.os }}" = "Windows" ]; then
            while true; do sleep 300; done
          else
            sleep 21600
          fi
